name: Release

on:
    push:
        tags:
            - v*

permissions:
    contents: write

jobs:
    checks:
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            - name: Check out source code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Resolve Go version
              id: go-versions
              uses: grafana/k6-ci/.github/actions/go-versions@7dc7a71c57a30eddd3f1591ee0cc5abaeedafa14 # v0.5.4

            - name: Install Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: ${{ steps.go-versions.outputs.current }}
                  cache: false

            - name: Install esbuild
              run: make install-esbuild

            - name: Build & archive
              run: |
                  set -x
                  VERSION="${GITHUB_REF##*/}"
                  make release && tar -zcf "k6-jslib-aws-${VERSION}.tar.gz" -C dist .

            - name: Create release with assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -x
                  VERSION="${GITHUB_REF##*/}"
                  gh release create "${VERSION}" "k6-jslib-aws-${VERSION}.tar.gz" dist/* --target "${GITHUB_SHA}" --title "${VERSION}"
