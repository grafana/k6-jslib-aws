name: CI
on:
    # Enables running the workflow manually from the Actions tab
    workflow_dispatch:

    push:
        branches:
            - main
        tags:
            - v*

    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                k6-major: [v1, v2]
        permissions:
          contents: read

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: Resolve Go version
              id: go-versions
              uses: grafana/k6-ci/.github/actions/go-versions@7dc7a71c57a30eddd3f1591ee0cc5abaeedafa14 # v0.5.4

            - name: Install Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: ${{ steps.go-versions.outputs.current }}
                  cache: false

            - name: Install development tools
              run: make install-biome install-esbuild install-k6-${{ matrix.k6-major }}

            - name: Check Formatting
              run: make fmt-check

            - name: Check Linting
              run: make lint

            - name: Build
              run: make build

            - name: Build the docker-compose stack
              uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3.2.0
              with:
                  up-flags: '-d --wait --wait-timeout 300'
                  down-flags: '-v'

            - name: Test with k6 ${{ matrix.k6-major }}
              run: make test-ci-${{ matrix.k6-major }}
