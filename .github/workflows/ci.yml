name: CI
on:
    # Enables running the workflow manually from the Actions tab
    workflow_dispatch:

    push:
        branches:
            - main
        tags:
            - v*

    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
          contents: read

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
              with:
                  go-version: 1.26.x
                  cache: false

            - name: Install development tools
              run: make install-tools

            - name: Check Formatting
              run: make fmt-check

            - name: Check Linting
              run: make lint

            - name: Build
              run: make build

            - name: Build the docker-compose stack
              uses: hoverkraft-tech/compose-action@b659c744ee9bed25aea2307c017ad849bd104433 # v3.2.0
              with:
                  up-flags: '-d --wait --wait-timeout 300'
                  down-flags: '-v'

            - name: Test
              run: make test-ci
