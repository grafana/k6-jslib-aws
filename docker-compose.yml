services:
    fakecloud:
        image: ghcr.io/faiscadev/fakecloud:0.51.0@sha256:6242e3b38c7a8dfb6bbfa2b682b0f5fe4f4b2ea8f465128f0f871a2738a65800
        ports:
            - '127.0.0.1:4566:4566'
        environment:
            FAKECLOUD_ADDR: '0.0.0.0:4566'
            FAKECLOUD_REGION: us-east-1
            FAKECLOUD_ACCOUNT_ID: '000000000000'
            FAKECLOUD_VERIFY_SIGV4: 'true'
        # Allow the development emulator to connect to Docker on SELinux hosts.
        security_opt:
            - label=disable
        volumes:
            - '/run/docker.sock:/var/run/docker.sock'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        healthcheck:
            test: ['CMD', 'fakecloud', 'healthcheck']
            interval: 2s
            timeout: 3s
            retries: 30
